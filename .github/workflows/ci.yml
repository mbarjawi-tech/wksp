name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# Superseded pushes to the same PR/branch are cancelled — unlike the Pages
# workflow, nothing here is deployed, so cancelling only saves runner minutes.
# Runs on `main` are never cancelled: those are the ones worth keeping.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: test (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    # The suite creates real git repos in temp dirs; several minutes is normal.
    timeout-minutes: 30

    # 18 is the floor `engines.node` advertises — running it is what turns that
    # claim into an enforced one — and 24 is what the release and docs workflows
    # already build on. A first run across 18/20/22/24 on both OSes gave
    # byte-identical results per OS, so the two middle versions were dropped as
    # pure cost; widening again is a one-line change.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [18, 24]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      # Integration tests commit in throwaway repos. The helpers set a repo-local
      # identity, but runners have no global one at all, so anything that commits
      # outside a helper would fail with "Please tell me who you are".
      - name: Configure git identity
        run: |
          git config --global user.name "wksp ci"
          git config --global user.email "ci@wksp.test"

      # The Windows runner sets TEMP to the 8.3 short form
      # (C:\Users\RUNNER~1\AppData\Local\Temp), so os.tmpdir() — where every
      # integration test builds its repos — hands back a short path while git
      # reports the long one (C:\Users\runneradmin\...). wksp compares those
      # paths as strings, so 13 tests mismatch. Point temp at the runner's own
      # long-path temp dir; whether wksp itself should canonicalise short paths
      # is a separate question, deliberately not decided here.
      - name: Use a long-path temp dir (Windows TEMP is an 8.3 short path)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $dir = Join-Path $env:RUNNER_TEMP 'jest'
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          "TEMP=$dir" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "TMP=$dir"  | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - run: npm ci

      - run: npx jest

  # One stable check name for branch protection to require. The matrix jobs are
  # named after their own axes, so requiring them directly means every matrix
  # change silently breaks the requirement — a required check that stops
  # reporting blocks every merge in the repo. This job's name never moves.
  ci:
    name: ci
    needs: test
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Fail unless every matrix job succeeded
        if: needs.test.result != 'success'
        run: |
          echo "matrix result: ${{ needs.test.result }}"
          exit 1
